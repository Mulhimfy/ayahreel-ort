name: ORT Android (reduced)

on:
  workflow_dispatch:
    inputs:
      ort:
        description: ONNX Runtime tag
        default: v1.31.1
  push:
    branches: [main]
    paths: ['ops.config', 'build_settings_android.json', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (keep the Android SDK)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium || true
          df -h / | tail -1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Tools
        run: |
          set -euo pipefail
          sudo apt-get install -y ninja-build >/dev/null
          python3 -m pip install --quiet flatbuffers numpy
          cmake --version | head -1
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true
          echo "NDK latest: $ANDROID_NDK_LATEST_HOME"
      - name: Build
        env:
          ORT: ${{ github.event.inputs.ort || 'v1.31.1' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ORT" https://github.com/microsoft/onnxruntime.git ort
          NDK=$(ls -d "$ANDROID_HOME"/ndk/29.* 2>/dev/null | tail -1)
          export ANDROID_NDK_HOME="${NDK:-$ANDROID_NDK_LATEST_HOME}"
          echo "NDK: $ANDROID_NDK_HOME"
          python3 ort/tools/ci_build/github/android/build_aar_package.py \
            --build_dir="$PWD/work" \
            --config=Release \
            --android_sdk_path="$ANDROID_HOME" \
            --android_ndk_path="$ANDROID_NDK_HOME" \
            --include_ops_by_config="$PWD/ops.config" \
            "$PWD/build_settings_android.json"
          find work -name '*.aar' -exec ls -la {} \;
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ORT: ${{ github.event.inputs.ort || 'v1.31.1' }}
        run: |
          set -euo pipefail
          AAR=$(find work -path '*aar_out*' -name '*.aar' | head -1)
          [ -n "$AAR" ] || AAR=$(find work -name '*.aar' | head -1)
          NAME="onnxruntime-android-${ORT#v}-listen.aar"
          cp "$AAR" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          unzip -l "$NAME" | grep '\.so'
          TAG="android-${ORT#v}-$(git rev-parse --short HEAD)"
          gh release create "$TAG" "$NAME" "$NAME.sha256" --title "$TAG" \
            --notes "Reduced ONNX Runtime $ORT for Android (ops.config at $(git rev-parse --short HEAD))."
